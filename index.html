<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <input type="color" class="color-input" id="color-input">
        <select name="schemes" id="select-container">
            <option value="monochrome">Monochrome</option>
            <option value="monochrome-dark">Monochrome-dark</option>
            <option value="monochrome-light">Monochrome-light</option>
            <option value="analogic">Analogic</option>
            <option value="complement">Complement</option>
            <option value="analogic-complement">Analogic-complement</option>
            <option value="triad">Triad</option>
        </select>
        <button id="get-color-btn">Get color scheme</button>
    </header>

    <main>
        <div class="color-container" id="scheme-1"></div>
        <div class="color-container" id="scheme-2"></div>
        <div class="color-container" id="scheme-3"></div>
        <div class="color-container" id="scheme-4"></div>
        <div class="color-container" id="scheme-5"></div>
    </main>

    <footer>
        <div class="hex-container">
            <p id="hex-1"></p>
            <p id="hex-2"></p>
            <p id="hex-3"></p>
            <p id="hex-4"></p>
            <p id="hex-5"></p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
